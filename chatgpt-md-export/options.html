<!doctype html>
<meta charset="utf-8" />
<title>ChatGPT → MD: Options</title>
<link rel="stylesheet" href="style.css">

<div class="container">
  <h2>저장 설정</h2>

  <div class="options-grid">
    <div class="grid-label">저장 위치</div>
    <div class="radio-group">
      <label><input type="radio" name="target" value="local"> 로컬 (기본 다운로드 폴더)</label>
      <label><input type="radio" name="target" value="gdrive"> Google Drive</label>
    </div>

    <div class="grid-label">로컬 폴더</div>
    <div><input id="folder" type="text" placeholder="ChatGPT" /></div>

    <div class="grid-label">파일명 패턴</div>
    <div>
      <input id="pattern" type="text" placeholder="{date}-{time}-{title}" />
      <small>토큰: {title}, {date}, {time} (확장자는 .md로 자동 추가)</small>
    </div>

    <div class="grid-label">Google Drive 폴더 ID</div>
    <div>
      <input id="driveFolderId" type="text" placeholder="예: 1AbCdEfGhIj..." />
      <small>웹에서 해당 폴더를 열고 URL의 마지막 ID를 복사하세요.</small>
    </div>

    <div class="grid-label">Google 계정 연결</div>
    <div>
      <button id="connect">연결</button>
      <button id="disconnect" class="secondary">해제</button>
      <span id="authStatus" style="margin-left:8px"></span>
    </div>
  </div>

  <div class="button-group">
    <button id="save">설정 저장</button>
    <span id="status" style="margin-left:8px"></span>
  </div>
</div>

<script src="options.js"></script>

<!doctype html>
<meta charset="utf-8" />
<title>ChatGPT → MD: Options</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<div class="container">
  <h2>저장 설정</h2>

  <div class="row g-3 mb-4">
    <div class="col-md-3 form-label">저장 위치</div>
    <div class="col-md-9">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="target" id="local" value="local">
        <label class="form-check-label" for="local">로컬 (기본 다운로드 폴더)</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="target" id="gdrive" value="gdrive">
        <label class="form-check-label" for="gdrive">Google Drive</label>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <label for="folder" class="col-md-3 col-form-label form-label">로컬 폴더</label>
    <div class="col-md-9">
      <input id="folder" type="text" class="form-control" placeholder="ChatGPT">
    </div>
  </div>

  <div class="row g-3 mb-3">
    <label for="pattern" class="col-md-3 col-form-label form-label">파일명 패턴</label>
    <div class="col-md-9">
      <input id="pattern" type="text" class="form-control" placeholder="{date}-{time}-{title}">
      <div class="form-text">토큰: {year}, {month}, {date}, {time}, {title} (확장자는 .md로 자동 추가)</div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <label for="driveFolderId" class="col-md-3 col-form-label form-label">Google Drive 폴더 ID</label>
    <div class="col-md-9">
      <input id="driveFolderId" type="text" class="form-control" placeholder="예: 1AbCdEfGhIj...">
      <div class="form-text">웹에서 해당 폴더를 열고 URL의 마지막 ID를 복사하세요.</div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3 form-label">Google 계정 연결</div>
    <div class="col-md-9 d-flex align-items-center">
      <button id="connect" class="btn btn-primary"><i class="bi bi-google"></i> 연결</button>
      <button id="disconnect" class="btn btn-secondary ms-2">해제</button>
      <span id="authStatus"></span>
    </div>
  </div>

  <div class="d-flex align-items-center">
    <button id="save" class="btn btn-success"><i class="bi bi-check-circle"></i> 설정 저장</button>
    <span id="status"></span>
  </div>
</div>

<script src="options.js"></script>
